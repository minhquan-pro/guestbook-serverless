AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Guestbook Serverless Backend - Event registration system

Parameters:
  Env:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]
    Description: Môi trường triển khai, dùng cho tag Env trên mọi resource.

Globals:
  Function:
    Runtime: nodejs24.x
    MemorySize: 128
    Architectures:
      - x86_64

Resources:
  # ============================================================
  # API Gateway
  # ============================================================
  GuestbookApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"
      Tags:
        Name: guestbook-apigateway
        Project: guestbook
        Env: !Ref Env

  # ============================================================
  # Lambda Functions
  # ============================================================
  SubmitFormFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: guestbook-lambda-submitform
      Handler: src/submitForm/index.handler
      Timeout: 10
      Environment:
        Variables:
          TABLE_NAME: !Ref EntriesTable
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt EntriesTable.Arn
      Events:
        SubmitApi:
          Type: Api
          Properties:
            RestApiId: !Ref GuestbookApi
            Path: /submit
            Method: post
      Tags:
        Name: guestbook-lambda-submitform
        Project: guestbook
        Env: !Ref Env

  GetSubmissionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: guestbook-lambda-getsubmissions
      Handler: src/getSubmissions/index.handler
      Timeout: 10
      Environment:
        Variables:
          TABLE_NAME: !Ref EntriesTable
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
              Resource: !GetAtt EntriesTable.Arn
      Events:
        GetSubmissionsApi:
          Type: Api
          Properties:
            RestApiId: !Ref GuestbookApi
            Path: /submissions
            Method: get
      Tags:
        Name: guestbook-lambda-getsubmissions
        Project: guestbook
        Env: !Ref Env

  StreamProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: guestbook-lambda-streamprocessor
      Handler: src/streamProcessor/index.handler
      Timeout: 30
      Environment:
        Variables:
          NOTIFICATION_QUEUE_URL: !Ref NotificationQueue
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: !GetAtt NotificationQueue.Arn
            - Effect: Allow
              Action:
                - dynamodb:DescribeStream
                - dynamodb:GetRecords
                - dynamodb:GetShardIterator
                - dynamodb:ListStreams
              Resource: !GetAtt EntriesTable.StreamArn
      Events:
        DynamoDBStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt EntriesTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 10
      Tags:
        Name: guestbook-lambda-streamprocessor
        Project: guestbook
        Env: !Ref Env

  SenderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: guestbook-lambda-sender
      Handler: src/sender/index.handler
      Timeout: 30
      Environment:
        Variables:
          TABLE_NAME: !Ref EntriesTable
          ADMIN_TOPIC_ARN: !Ref AdminTopic
          SSM_ADMIN_EMAIL: /guestbook/admin-email
          SSM_SES_DOMAIN: /guestbook/ses-domain
          SSM_SES_TEMPLATE_NAME: /guestbook/ses-template-name
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - ses:SendTemplatedEmail
              Resource:
                - !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:template/GuestbookConfirmation'
                # The sending identity/domain is resolved from SSM at runtime, so it is not
                # known at deploy time and cannot be scoped to a specific identity ARN here.
                - !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/*'
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref AdminTopic
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt EntriesTable.Arn
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource:
                - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/guestbook/admin-email'
                - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/guestbook/ses-domain'
                - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/guestbook/ses-template-name'
      Events:
        SQSTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt NotificationQueue.Arn
            BatchSize: 1
      Tags:
        Name: guestbook-lambda-sender
        Project: guestbook
        Env: !Ref Env

  # ============================================================
  # DynamoDB Table
  # ============================================================
  EntriesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: guestbook-dynamodb-entries
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: submissionId
          AttributeType: S
      KeySchema:
        - AttributeName: submissionId
          KeyType: HASH
      StreamSpecification:
        StreamViewType: NEW_IMAGE
      Tags:
        - Key: Name
          Value: guestbook-dynamodb-entries
        - Key: Project
          Value: guestbook
        - Key: Env
          Value: !Ref Env

  # ============================================================
  # SQS Queues
  # ============================================================
  NotificationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: guestbook-sqs-notification
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt NotificationDLQ.Arn
        maxReceiveCount: 3
      Tags:
        - Key: Name
          Value: guestbook-sqs-notification
        - Key: Project
          Value: guestbook
        - Key: Env
          Value: !Ref Env

  NotificationDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: guestbook-sqs-notification-dlq
      MessageRetentionPeriod: 1209600
      Tags:
        - Key: Name
          Value: guestbook-sqs-notification-dlq
        - Key: Project
          Value: guestbook
        - Key: Env
          Value: !Ref Env

  # ============================================================
  # SNS Topic
  # ============================================================
  AdminTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: guestbook-sns-admin
      Tags:
        - Key: Name
          Value: guestbook-sns-admin
        - Key: Project
          Value: guestbook
        - Key: Env
          Value: !Ref Env

  # ============================================================
  # SES Email Template
  # ============================================================
  # The HTML body is kept inline on purpose: CloudFormation compares the literal
  # HtmlPart value on every `sam deploy`, so editing the markup here is enough to
  # push the change to SES. No separate HTML file and no custom resource to keep
  # in sync.
  #
  # NOTE: do NOT add a `Tags` property here. AWS::SES::Template does not support
  # tagging, so CloudFormation/SAM validation fails if one is added.
  GuestbookEmailTemplate:
    Type: AWS::SES::Template
    Properties:
      Template:
        TemplateName: GuestbookConfirmation
        SubjectPart: "Xác nhận đăng ký sự kiện"
        TextPart: |
          Xin chào {{name}},

          Cảm ơn bạn đã đăng ký tham dự sự kiện!

          Thông tin đăng ký:
          - Email: {{email}}
          - Thời gian đăng ký: {{submittedAt}}

          Chúng tôi sẽ liên hệ với bạn khi có thông tin chi tiết hơn.
        HtmlPart: |
          <!DOCTYPE html>
          <html lang="vi" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <meta http-equiv="X-UA-Compatible" content="IE=edge">
            <title>Xác nhận đăng ký sự kiện</title>
            <!--[if mso]>
            <noscript>
              <xml>
                <o:OfficeDocumentSettings>
                  <o:PixelsPerInch>96</o:PixelsPerInch>
                </o:OfficeDocumentSettings>
              </xml>
            </noscript>
            <![endif]-->
          </head>
          <body style="margin: 0; padding: 0; background-color: #0B0B12; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased;">
            <!-- Outer wrapper table -->
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color: #0B0B12;">
              <tr>
                <td align="center" style="padding: 40px 20px;">
                  <!-- Main card container -->
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="max-width: 600px; width: 100%; background-color: #151035; border: 1px solid #8B5CF6; border-radius: 12px;">
                    <!-- Header section -->
                    <tr>
                      <td style="padding: 40px 40px 24px 40px; text-align: center;">
                        <h1 style="margin: 0; font-size: 24px; font-weight: 700; color: #32EFB9; line-height: 1.3;">
                          Xác nhận đăng ký sự kiện
                        </h1>
                      </td>
                    </tr>
                    <!-- Greeting -->
                    <tr>
                      <td style="padding: 0 40px 16px 40px;">
                        <p style="margin: 0; font-size: 16px; color: #FFFFFF; line-height: 1.6;">
                          Xin chào {{name}},
                        </p>
                      </td>
                    </tr>
                    <!-- Body text -->
                    <tr>
                      <td style="padding: 0 40px 32px 40px;">
                        <p style="margin: 0; font-size: 15px; color: #FFFFFF; line-height: 1.6;">
                          Cảm ơn bạn đã đăng ký tham dự sự kiện! Chúng tôi đã ghi nhận thông tin của bạn.
                        </p>
                      </td>
                    </tr>
                    <!-- Info/details card with teal left border -->
                    <tr>
                      <td style="padding: 0 40px 32px 40px;">
                        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color: #0B0B12; border-left: 4px solid #32EFB9; border-radius: 8px;">
                          <tr>
                            <td style="padding: 20px 24px;">
                              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                                <tr>
                                  <td style="padding-bottom: 12px;">
                                    <span style="font-size: 12px; font-weight: 600; color: #8B87B3; text-transform: uppercase; letter-spacing: 0.5px;">Email</span>
                                  </td>
                                </tr>
                                <tr>
                                  <td style="padding-bottom: 20px;">
                                    <span style="font-size: 15px; color: #FFFFFF;">{{email}}</span>
                                  </td>
                                </tr>
                                <tr>
                                  <td style="padding-bottom: 12px;">
                                    <span style="font-size: 12px; font-weight: 600; color: #8B87B3; text-transform: uppercase; letter-spacing: 0.5px;">Thời gian đăng ký</span>
                                  </td>
                                </tr>
                                <tr>
                                  <td>
                                    <span style="font-size: 15px; color: #FFFFFF;">{{submittedAt}}</span>
                                  </td>
                                </tr>
                              </table>
                            </td>
                          </tr>
                        </table>
                      </td>
                    </tr>
                    <!-- Footer message -->
                    <tr>
                      <td style="padding: 0 40px 40px 40px;">
                        <p style="margin: 0; font-size: 14px; color: #8B87B3; line-height: 1.6;">
                          Chúng tôi sẽ liên hệ với bạn khi có thông tin chi tiết hơn.
                        </p>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
            </table>
          </body>
          </html>

  # ============================================================
  # CloudWatch Alarm - DLQ Monitoring
  # ============================================================
  DLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: guestbook-dlq-messages-alarm
      AlarmDescription: Alarm when DLQ has messages (notification failures detected)
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt NotificationDLQ.QueueName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        - !Ref AdminTopic
      Tags:
        - Key: Name
          Value: guestbook-dlq-messages-alarm
        - Key: Project
          Value: guestbook
        - Key: Env
          Value: !Ref Env

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${GuestbookApi}.execute-api.${AWS::Region}.amazonaws.com/prod'

  EntriesTableName:
    Description: DynamoDB table name
    Value: !Ref EntriesTable

  NotificationQueueUrl:
    Description: SQS notification queue URL
    Value: !Ref NotificationQueue

  AdminTopicArn:
    Description: SNS admin topic ARN
    Value: !Ref AdminTopic

